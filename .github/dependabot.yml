version: 2
updates:
  - package-ecosystem: npm
    directories:
      - /
      - /packages/graph
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # TypeScript stays on 6.x until svelte-check accepts 7.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      # @types/node follows the Node bundled in Electron.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    commit-message:
      prefix: build
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: ci
      include: scope
