name: Benchmark

# Compares `scripts/bench.ts` on a PR with its base, on the same machine. Not a required check:
# it is outside CI so that it stays out of `all-checks`. Shared runners are noisy.
# It never comments on the PR (every comment sends e-mail): the table is in the job summary of
# the run, and a slower metric adds a warning annotation.
on:
  pull_request:
    # Only the code the benchmark runs: add here whatever `bench.ts` starts to import. Safe to
    # filter because the check is not required. `--graph` needs a GPU, which the runner has not:
    # this job never runs it, so `packages/graph/**` is not listed.
    paths:
      - src/main/**
      - src/shared/**
      - src/renderer/note-cache.ts
      - src/renderer/note-search.ts
      - scripts/bench.ts
      - scripts/bench-compare.ts
      - scripts/bench-graph*.ts
      - scripts/gen-vault.ts
      - package.json
      - package-lock.json
      - .github/workflows/bench.yml

permissions:
  contents: read

concurrency:
  group: bench-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # Runs the PR's code, so it only gets read access.
  bench:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      SIZES: '10000'
      # Invocations per side, one run each. About 60 s per invocation at 10k notes, mostly the
      # cold and warm index; 100k does not fit. Do not go below 3: with 3, one outlier run does
      # not move a median, so by itself it cannot raise a warning.
      ROUNDS: 3
    steps:
      # The PR merged into its base (`HEAD`); `HEAD^1` is that base.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Same major as the Node bundled in Electron.
          node-version: 24
          cache: npm
      # `--ignore-scripts` skips the Electron download: only the Node runtime is measured,
      # and `better-sqlite3` ships prebuilt binaries.
      - name: Install the PR
        run: npm ci --ignore-scripts

      # A base that cannot be installed or measured is reported as not comparable.
      - name: Install the base
        id: base
        continue-on-error: true
        run: |
          git worktree add --detach "$RUNNER_TEMP/base" HEAD^1
          cd "$RUNNER_TEMP/base"
          test -f scripts/bench.ts
          npm ci --ignore-scripts

      # Each side runs its own benchmark code. The order alternates (base PR, PR base, ...)
      # so that a runner that speeds up or slows down does not favor one side.
      - name: Measure
        env:
          BASE_READY: ${{ steps.base.outcome == 'success' }}
        run: |
          measure() {
            (cd "$2" && node scripts/bench.ts --sizes "$SIZES" --runs 1 --label "$1" \
              --out "$RUNNER_TEMP/results/$1/$3.json")
          }
          pr_failed=0
          for round in $(seq 1 "$ROUNDS"); do
            order="base pr"
            if (( round % 2 == 0 )); then order="pr base"; fi
            for side in $order; do
              if [[ $side == pr ]]; then
                measure pr "$GITHUB_WORKSPACE" "$round" || pr_failed=1
              elif [[ $BASE_READY == true ]]; then
                measure base "$RUNNER_TEMP/base" "$round" || echo "::warning::The base benchmark failed (round $round)."
              fi
            done
          done
          exit "$pr_failed"

      - name: Compare
        if: ${{ !cancelled() }}
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          node scripts/bench-compare.ts --base "$RUNNER_TEMP/results/base" --pr "$RUNNER_TEMP/results/pr" \
            --note "Head ${HEAD_SHA:0:7} · [run]($RUN_URL)" --out "$RUNNER_TEMP/report.md"
          cat "$RUNNER_TEMP/report.md" >> "$GITHUB_STEP_SUMMARY"
          if grep -q 'metric(s) slower than the base' "$RUNNER_TEMP/report.md"; then
            echo "::warning title=Benchmark::Slower than the base. See the table in the job summary."
          fi
