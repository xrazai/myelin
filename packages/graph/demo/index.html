<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>@myelin/graph demo</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b0f0e; color: #e2e8e5; font: 13px system-ui, sans-serif; }
  /* The graph needs a CSS size from the page. */
  canvas { display: block; width: 100%; height: 100%; }
  header { position: fixed; top: 8px; left: 8px; display: flex; gap: 8px; align-items: center; }
  select, button { font: inherit; color: inherit; background: #111615; border: 1px solid #1e2926; border-radius: 4px; padding: 2px 6px; }
  output { color: #8a9992; }
</style>
</head>
<body>
<canvas></canvas>
<header>
  <select id="nodes" aria-label="Nodes">
    <option value="1000">1k nodes</option>
    <option value="10000" selected>10k nodes</option>
    <option value="50000">50k nodes</option>
    <option value="100000">100k nodes</option>
  </select>
  <button id="fit" type="button">Fit</button>
  <output id="status"></output>
</header>
<script type="module" src="./main.ts"></script>
</body>
</html>
